services:
  postgres:
    image: postgres:17-alpine
    container_name: bckl_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-klcn_ecommerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-klcn_ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: bckl_pgdata

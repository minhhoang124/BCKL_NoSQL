server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Note: add_header inside a location replaces server-level headers, so the
  # security headers are repeated in each location.

  # Hashed build assets can be cached; index.html must always be revalidated.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # Single-page app: client-side routes fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }
}

name: Báo lỗi
description: Ghi nhận lỗi để tái hiện, sửa và kiểm tra lại
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Mức độ
      options:
        - Nghiêm trọng
        - Trung bình
        - Nhẹ
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Môi trường


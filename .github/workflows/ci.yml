name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: klcn_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/klcn_ecommerce?schema=public
      BACKEND_PORT: 3001
      FRONTEND_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3001
      JWT_ACCESS_SECRET: ci-access-secret-change-only-for-tests
      JWT_REFRESH_SECRET: ci-refresh-secret-change-only-for-tests
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 604800
      JWT_ISSUER: klcn-ecommerce-api
      JWT_AUDIENCE: klcn-ecommerce-web
      AI_SERVICE_PORT: 8000
      AI_SERVICE_URL: http://localhost:8000
      ELASTICSEARCH_URL: http://localhost:9200

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: klcn_ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d klcn_ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check required repository files
        shell: bash
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f .env.example
          test -f docs/api/ai-service-contract.md

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check "HEAD^...HEAD"
          fi

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Apply database migrations
        run: pnpm --dir BE exec prisma migrate deploy

      - name: Seed test database
        run: pnpm prisma:seed

      - name: Lint workspaces
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build workspaces
        run: pnpm build

      - name: Run Backend E2E tests
        run: pnpm --dir BE test:e2e

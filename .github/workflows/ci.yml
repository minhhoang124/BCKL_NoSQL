name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required repository files
        shell: bash
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f .env.example
          test -f docs/api/ai-service-contract.md

